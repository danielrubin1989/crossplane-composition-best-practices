# moto: an in-cluster fake AWS API. IAM, S3 and STS are real enough for the
# providers to create resources and report ARNs back - no AWS account needed.
apiVersion: v1
kind: Namespace
metadata:
  name: aws-mock
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moto
  namespace: aws-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moto
  template:
    metadata:
      labels:
        app: moto
    spec:
      # The Service is named "moto", so Kubernetes would inject MOTO_PORT=tcp://...
      # which moto reads as its listen port and crashes on.
      enableServiceLinks: false
      containers:
      - name: moto
        image: motoserver/moto:5.2.4
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /moto-api/
            port: 5000
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: moto
  namespace: aws-mock
spec:
  selector:
    app: moto
  ports:
  - port: 5000
    targetPort: 5000
